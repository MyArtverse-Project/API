name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      certificate_arn:
        description: "ACM certificate ARN (optional, enables HTTPS on ALB)"
        required: false
        type: string
      api_hostname:
        description: "API hostname (e.g. api.myartverse.app)"
        required: false
        default: api.myartverse.app
      cookie_domain:
        description: "Cookie domain (e.g. .myartverse.app)"
        required: false
        default: .myartverse.app

concurrency:
  group: deploy-infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy CDK stack
        working-directory: infra
        run: |
          ARGS=""
          if [[ -n "${{ inputs.certificate_arn }}" ]]; then
            ARGS="$ARGS -c certificateArn=${{ inputs.certificate_arn }}"
          fi
          if [[ -n "${{ inputs.api_hostname }}" ]]; then
            ARGS="$ARGS -c apiHostname=${{ inputs.api_hostname }}"
          fi
          if [[ -n "${{ inputs.cookie_domain }}" ]]; then
            ARGS="$ARGS -c cookieDomain=${{ inputs.cookie_domain }}"
          fi
          npx cdk deploy MyArtverseStack --require-approval never $ARGS
